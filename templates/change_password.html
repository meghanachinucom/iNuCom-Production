<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - iNuCom Production Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Set New Password</h1>
                <p>You must change your default password to secure your account before continuing.</p>
            </div>
            
            {% with messages = get_flashed_messages(category_filter=["error"]) %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-error">
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('change_password') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="new_password">NEW PASSWORD</label>
                    <div class="input-wrapper">
                        <input type="password" id="new_password" name="new_password" class="form-input" placeholder="Enter new password" required autofocus>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">CONFIRM NEW PASSWORD</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Confirm new password" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" style="margin-top: 12px;">Update Password</button>
            </form>
        </div>
    </div>
</body>
</html>
